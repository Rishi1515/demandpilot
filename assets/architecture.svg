<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #0b0b0b; stroke-width: 1.5; }
      .key { fill: #eef4fc; stroke: #2a78d6; stroke-width: 2; }
      .num { fill: #2a78d6; font-size: 13px; font-weight: 700; }
      .title { fill: #0b0b0b; font-size: 17px; font-weight: 700; }
      .body { fill: #3a3935; font-size: 13px; }
      .file { fill: #6a6963; font-size: 12px; font-family: Consolas, Menlo, monospace; }
      .flow { stroke: #52514e; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .side { stroke: #eb6834; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .band { fill: #f6f5f1; }
      .bandlabel { fill: #6a6963; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fcfcfb"/>
  <text x="40" y="42" class="title" style="font-size:22px">DemandPilot architecture</text>
  <text x="40" y="66" class="body">From an uploaded CSV to a reviewable reorder recommendation. Every number shown to the user is computed in Python, not by a language model.</text>

  <rect x="20" y="90" width="1160" height="210" rx="10" class="band"/>
  <text x="1160" y="112" text-anchor="end" class="bandlabel">DATA AND MODELLING</text>
  <rect x="20" y="330" width="1160" height="210" rx="10" class="band"/>
  <text x="1160" y="352" text-anchor="end" class="bandlabel">DECISION AND PRODUCT</text>

  <!-- Row 1 -->
  <g transform="translate(40,125)">
    <rect width="250" height="155" rx="8" class="box"/>
    <text x="16" y="28" class="num">1</text><text x="34" y="28" class="title">Upload CSV</text>
    <text x="16" y="56" class="body">date, product_id, units_sold</text>
    <text x="16" y="76" class="body">+ optional stock, lead time,</text>
    <text x="16" y="96" class="body">price, cost, promotion</text>
    <text x="16" y="138" class="file">app.py (in memory only)</text>
  </g>
  <g transform="translate(330,125)">
    <rect width="250" height="155" rx="8" class="box"/>
    <text x="16" y="28" class="num">2</text><text x="34" y="28" class="title">Validate and clean</text>
    <text x="16" y="56" class="body">Missing columns, bad dates,</text>
    <text x="16" y="76" class="body">negative units, duplicates,</text>
    <text x="16" y="96" class="body">short history: all reported</text>
    <text x="16" y="138" class="file">src/data_validation.py</text>
  </g>
  <g transform="translate(620,125)">
    <rect width="250" height="155" rx="8" class="box"/>
    <text x="16" y="28" class="num">3</text><text x="34" y="28" class="title">Daily series + features</text>
    <text x="16" y="56" class="body">Gaps filled, lags 1/7/14/28,</text>
    <text x="16" y="76" class="body">rolling stats, calendar. Built</text>
    <text x="16" y="96" class="body">only from past values</text>
    <text x="16" y="138" class="file">src/features.py</text>
  </g>
  <g transform="translate(910,125)">
    <rect width="250" height="155" rx="8" class="key"/>
    <text x="16" y="28" class="num">4</text><text x="34" y="28" class="title">Rolling backtest</text>
    <text x="16" y="56" class="body">Seasonal naive, moving avg,</text>
    <text x="16" y="76" class="body">Holt-Winters, LightGBM.</text>
    <text x="16" y="96" class="body">Refit before each cutoff</text>
    <text x="16" y="138" class="file">src/models.py, backtesting.py</text>
  </g>
  <path d="M290,202 H326" class="flow"/>
  <path d="M580,202 H616" class="flow"/>
  <path d="M870,202 H906" class="flow"/>
  <path d="M1035,280 V305 Q1035,315 1025,315 H175 Q165,315 165,325 V361" class="flow"/>

  <!-- Row 2 -->
  <g transform="translate(40,365)">
    <rect width="250" height="155" rx="8" class="key"/>
    <text x="16" y="28" class="num">5</text><text x="34" y="28" class="title">Select + forecast</text>
    <text x="16" y="56" class="body">Lowest WAPE wins; simpler</text>
    <text x="16" y="76" class="body">model if within 2%. Range</text>
    <text x="16" y="96" class="body">from scaled backtest errors</text>
    <text x="16" y="138" class="file">src/backtesting.py</text>
  </g>
  <g transform="translate(330,365)">
    <rect width="250" height="155" rx="8" class="key"/>
    <text x="16" y="28" class="num">6</text><text x="34" y="28" class="title">Inventory decision</text>
    <text x="16" y="56" class="body">Safety stock, reorder point,</text>
    <text x="16" y="76" class="body">order-up-to quantity,</text>
    <text x="16" y="96" class="body">stockout and excess flags</text>
    <text x="16" y="138" class="file">src/inventory.py (unit tested)</text>
  </g>
  <g transform="translate(620,365)">
    <rect width="250" height="155" rx="8" class="box"/>
    <text x="16" y="28" class="num">7</text><text x="34" y="28" class="title">Explanation</text>
    <text x="16" y="56" class="body">Template from computed facts.</text>
    <text x="16" y="76" class="body">Optional LLM rephrase, rejected</text>
    <text x="16" y="96" class="body">if it adds any new number</text>
    <text x="16" y="138" class="file">src/explanations.py</text>
  </g>
  <g transform="translate(910,365)">
    <rect width="250" height="155" rx="8" class="box"/>
    <text x="16" y="28" class="num">8</text><text x="34" y="28" class="title">Interface + exports</text>
    <text x="16" y="56" class="body">Charts with ranges, model</text>
    <text x="16" y="76" class="body">comparison, portfolio view,</text>
    <text x="16" y="96" class="body">CSV and HTML report</text>
    <text x="16" y="138" class="file">app.py, visualization.py</text>
  </g>
  <path d="M290,442 H326" class="flow"/>
  <path d="M580,442 H616" class="flow"/>
  <path d="M870,442 H906" class="flow"/>

  <!-- Scenario loop -->
  <path d="M1035,520 V580 H455 V524" class="side"/>
  <text x="560" y="604" class="body" fill="#9a4a24">User changes stock, lead time or service level: only step 6 onwards reruns (models are cached)</text>
</svg>
